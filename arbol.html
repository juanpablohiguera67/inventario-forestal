
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha del árbol</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ENCABEZADO -->

    <header class="encabezado">

        <div class="logo">
            🌳 Inventario Forestal
        </div>

        <nav class="menu">

            <a href="index.html">
                Inicio
            </a>

            <a href="index.html#arboles">
                Árboles
            </a>

        </nav>

    </header>



    <!-- FICHA DEL ÁRBOL -->

    <main>

        <section class="seccion">

            <div class="titulo-seccion">

                <p class="etiqueta">
                    FICHA DEL ÁRBOL
                </p>

                <h1 id="titulo-arbol">
                    Cargando...
                </h1>

                <p>
                    Información del árbol registrado.
                </p>

            </div>


            <!-- FOTO -->

            <div class="foto-arbol">
                
            </div>


            <!-- INFORMACIÓN -->

            <div class="informacion-arbol">

                <span class="codigo" id="codigo-arbol">
                    ARB-000
                </span>


                <h2 id="nombre-arbol">
                    Cargando...
                </h2>


                <p id="cientifico-arbol">
                    Cargando...
                </p>


                <hr>


                <h3>
                    Información del árbol
                </h3>


                <p>
                    <strong>Altura:</strong>
                    <span id="altura-arbol"></span>
                </p>


                <p>
                    <strong>Diámetro:</strong>
                    <span id="diametro-arbol"></span>
                </p>


                <p>
                    <strong>Estado:</strong>
                    <span id="estado-arbol"></span>
                </p>


                <p>
                    <strong>Ubicación:</strong>
                    <span id="ubicacion-arbol"></span>
                </p>


                <hr>


                <h3>
                    Descripción
                </h3>


                <p id="descripcion-arbol"></p>


            </div>


            <br>


            <a href="index.html#arboles" class="boton">
                ← Volver al inventario
            </a>

        </section>

    </main>



    <!-- PIE DE PÁGINA -->

    <footer>

        <p>
            © 2026 Inventario Forestal
        </p>

        <p>
            Proyecto ambiental escolar
        </p>

    </footer>



    <!-- DATOS -->

    <script src="datos.js"></script>


    <!-- CÓDIGO PARA MOSTRAR EL ÁRBOL -->

    <script>

        // Obtener el número del árbol desde la URL

        const parametros = new URLSearchParams(window.location.search);

        const id = parametros.get("id");


        // Buscar el árbol

        const arbol = arboles[id];


        // Comprobar si existe

        if (arbol) {

            document.getElementById("titulo-arbol").textContent =
                "Árbol " + id;

            document.getElementById("codigo-arbol").textContent =
                arbol.codigo;

            document.getElementById("nombre-arbol").textContent =
                arbol.nombre;

            document.getElementById("cientifico-arbol").textContent =
                arbol.cientifico;

            document.getElementById("altura-arbol").textContent =
                arbol.altura;

            document.getElementById("diametro-arbol").textContent =
                arbol.diametro;

            document.getElementById("estado-arbol").textContent =
                arbol.estado;

            document.getElementById("ubicacion-arbol").textContent =
                arbol.ubicacion;

            document.getElementById("descripcion-arbol").textContent =
                arbol.descripcion;

        }

        else {

            document.getElementById("titulo-arbol").textContent =
                "Árbol no encontrado";

        }

    </script>


</body>

</html>
